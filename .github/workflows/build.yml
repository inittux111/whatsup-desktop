# Builds and checks WhatsUp on Fedora 44, the primary target, on every push to
# master and every pull request, using the same libraries as the development
# toolbox, and builds the Debian stable package the way a release does.
# Running in Fedora and Debian containers (not the Ubuntu runner) is
# deliberate: they meet the GNOME versions WhatsUp needs (libadwaita 1.7, or
# 1.8 for the default adw-shortcuts feature, GTK 4.18 and WebKitGTK 6.0 2.50,
# the minimums in Cargo.toml), which the Ubuntu runners don't.
#
# Linting and building are separate jobs so each always reports: a clippy
# warning can't hide whether the tests pass, and the reverse. Actions are
# pinned to exact commits so a moved tag can't change what runs.
name: Build and test

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - CLAUDE.md
  pull_request:
    paths-ignore:
      - README.md
      - CLAUDE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # git first: the base Fedora image has none, and checkout needs it.
      - name: Install build dependencies
        run: |
          dnf install -y git cargo clippy rustfmt gcc pkgconf-pkg-config \
            libadwaita-devel webkitgtk6.0-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The Debian build uses --no-default-features (libadwaita 1.7 shortcuts
      # fallback). The feature gate exercises that path here too, so it can't
      # rot even though this container has libadwaita 1.8.
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git cargo gcc pkgconf-pkg-config \
            libadwaita-devel webkitgtk6.0-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build

  # Debian stable has older libraries than Fedora (libadwaita 1.7, GTK 4.18),
  # so only a build against them shows the --no-default-features path really
  # compiles there. It uses packaging/debian/Containerfile, the same image as
  # a local Debian build, and `make deb`, which also runs the tests
  # (debian/rules) and checks the packaging files.
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Debian container
        run: docker build -t whatsup-desktop-deb packaging/debian
      - name: Test and build the .deb
        run: docker run --rm -v "$PWD":/src -w /src whatsup-desktop-deb make deb
